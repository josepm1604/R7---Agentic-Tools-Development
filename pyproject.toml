[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-r7"
version = "0.2.0"
description = "Agente ReAct local sobre el plan de estudios UNI con herramientas estructuradas y RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python==0.3.38",
    "llama-index-core==0.14.26",
    "llama-index-embeddings-huggingface==0.9.0",
    "sentence-transformers==6.3.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pdfplumber==0.11.11",
    "pandas==3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
